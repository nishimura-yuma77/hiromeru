openapi: 3.1.0
info:
  title: hiromeru API
  version: 0.1.0-draft
  summary: AI支援型Xマーケティングシステム（MVP）のバックエンドAPI
  description: |
    画面設計（`SCREEN_DESIGN.md` の SC-00〜SC-10）が呼び出すバックエンドAPIの定義。
    根拠資料は `REQUIREMENTS.md`、`DATABASE.dbml`、`SCREEN_DESIGN.md`。
    読み物としての解説・状態遷移・エージェントツール定義・外部連携は `API_DESIGN.md` にまとめている。

    ## 共通規約

    - ベースパスは `/api/v1`。リクエスト・レスポンスはUTF-8のJSON（チャットのストリームのみ `text/event-stream`）。
    - 日時はRFC 3339（UTC、例: `2026-09-21T10:02:11Z`）。表示時のタイムゾーン変換はクライアントが行う。
    - IDは `int64` の整数。
    - **認証**: 外部IdP（OIDC）でログインし、サーバーが発行するセッションCookie（`hiromeru_session`、HttpOnly / Secure / SameSite=Lax）で識別する。
      `POST` / `PATCH` / `DELETE` はCSRF対策として `X-CSRF-Token` ヘッダー（`GET /me` で取得）を必須とする。
    - **テナント分離**: すべての業務データはセッションのマーケターが所属する会社に限定される。他社のリソースは存在しないものとして `404` を返す。
    - **エラー**: RFC 9457（`application/problem+json`）。`code` に機械可読なエラーコードを入れる。
    - **ページング**: カーソル方式。`limit`（既定20、最大100）と `cursor` を受け取り、`next_cursor` を返す（末尾は `null`）。
    - **楽観的排他**: 承認対象（施策・投稿）の更新・承認・投稿には、画面が表示していた `revision` を渡す。サーバー側の改訂と異なる場合は `409 REVISION_MISMATCH`。
    - **冪等性**: 外部への副作用があるエンドポイント（Xへの投稿）は `Idempotency-Key` を必須とする。
    - **サンプル値**はすべて架空のものである。

    ## 承認ゲート（NFR-SEC-003 / 004）

    施策の確定、投稿内容の確定、Xへの投稿、データ削除の承認は、**ログイン中のユーザーがこのAPIを直接呼ぶ**ことでのみ成立する。
    エージェントが呼べるツール（`API_DESIGN.md` §6）には承認・投稿実行の操作は含まれず、承認待ちの状態を作ることしかできない。
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:8080/api/v1
    description: ローカル開発
  - url: https://{host}/api/v1
    description: 本番（ホストは実装時に決定）
    variables:
      host:
        default: hiromeru.example.com
tags:
  - name: auth
    description: SC-00 ログイン / セッション
  - name: me
    description: ログインユーザー・ナビゲーションバッジ・クライアント設定
  - name: campaigns
    description: SC-02 施策一覧 / SC-03 施策詳細
  - name: posts
    description: SC-04 投稿一覧 / SC-05 投稿詳細・承認・投稿
  - name: metrics
    description: SC-06 計測結果
  - name: memories
    description: SC-07 記憶
  - name: chat
    description: SC-01 ホーム（親エージェントチャット）と承認カード
  - name: ops-cost
    description: SC-08 コスト
  - name: ops-sessions
    description: SC-09 実行履歴
  - name: ops-security
    description: SC-10 セキュリティイベント
  - name: internal
    description: 内部ジョブ（cron等から呼ぶ。画面からは使わない）
  - name: system
    description: ヘルスチェック
security:
  - cookieAuth: []
paths:
  /healthz:
    get:
      tags: [system]
      operationId: getHealth
      summary: ヘルスチェック
      description: 認証不要。プロセスの生存確認のみ行い、外部サービス（X / GA4 / OrcaRouter）の状態は見ない。
      security: []
      responses:
        '200':
          description: 稼働中
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok

  # ------------------------------------------------------------------ auth
  /auth/login:
    get:
      tags: [auth]
      operationId: startLogin
      summary: 外部IdPログインを開始する
      description: |
        SC-00「Googleでログイン」（IdPは実装時に決定）。OIDC Authorization Code + PKCE のリダイレクト先へ `302` で遷移させる。
        `state` / `nonce` / PKCE verifier はサーバーが短命Cookieで保持する。
      security: []
      parameters:
        - name: return_to
          in: query
          description: ログイン後に戻るアプリ内パス。`/` で始まる相対パスのみ許可（オープンリダイレクト防止）。
          schema:
            type: string
            pattern: '^/[^/\\].*$|^/$'
            default: /
      responses:
        '302':
          description: IdPの認可エンドポイントへリダイレクト
          headers:
            Location:
              schema:
                type: string
                format: uri

  /auth/callback:
    get:
      tags: [auth]
      operationId: finishLogin
      summary: IdPからのコールバック（セッション発行）
      description: |
        認可コードをトークンに交換し、`users` を `(auth_provider, auth_subject)` で照合して `last_signed_in_at` を更新、セッションCookieを発行して `return_to` へ `302` する。
        初回ログイン時にユーザー・会社・マーケターを自動作成するかは未確定（`API_DESIGN.md` U-1。現状は自動作成と仮置き）。
        `users.status = disabled` の場合は `/login?error=account_disabled` へ、その他の失敗は `/login?error=login_failed` へリダイレクトする。
      security: []
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: error
          in: query
          description: IdPが返したエラー。
          schema:
            type: string
      responses:
        '302':
          description: 'アプリへリダイレクト（成功時は `Set-Cookie: hiromeru_session`）'
          headers:
            Set-Cookie:
              schema:
                type: string
            Location:
              schema:
                type: string

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: ログアウト（セッション破棄）
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        '204':
          description: 破棄した（既に無効なセッションでも `204`）
        '403':
          $ref: '#/components/responses/Forbidden'

  # ------------------------------------------------------------------ me
  /me:
    get:
      tags: [me]
      operationId: getMe
      summary: ログインユーザーと所属会社
      description: 画面表示時に最初に呼ぶ。`csrf_token` は以後の更新系リクエストの `X-CSRF-Token` に使う。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /me/badges:
    get:
      tags: [me]
      operationId: getNavBadges
      summary: グローバルナビの「対応が必要な件数」バッジ
      description: |
        共通レイアウト（画面設計 §4）のバッジ。ナビ表示のたびに（例: 60秒ごとのポーリングで）取得する。
        - 施策 = 承認待ち件数
        - 投稿 = 承認待ち＋投稿失敗件数
        - 計測結果 = 計測失敗件数
        - セキュリティ = 直近24時間の検出件数
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NavBadges'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /config:
    get:
      tags: [me]
      operationId: getClientConfig
      summary: クライアントが使う設定値
      description: 文字数上限、円換算レートなど、サーバー設定のうち画面表示に必要なものを返す（機密値は含めない）。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientConfig'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ------------------------------------------------------------------ campaigns
  /campaigns:
    get:
      tags: [campaigns]
      operationId: listCampaigns
      summary: 施策一覧（SC-02）
      description: 既定では `archived` を除外する。`sort=attention` は承認待ちを先頭にする。
      parameters:
        - name: status
          in: query
          description: ステータスで絞り込む（複数指定可）。
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CampaignStatus'
          style: form
          explode: false
        - name: include_archived
          in: query
          schema:
            type: boolean
            default: false
        - name: q
          in: query
          description: タイトルの部分一致検索。
          schema:
            type: string
            maxLength: 255
        - name: sort
          in: query
          schema:
            type: string
            enum: [updated_at_desc, created_at_desc, attention]
            default: updated_at_desc
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CampaignSummary'
                  next_cursor:
                    type: [string, 'null']
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [campaigns]
      operationId: createCampaign
      summary: 施策を手動で作成する（SC-02「新規作成」）
      description: 作成直後のステータスは `draft`、`revision = 1`。エージェント経由の作成は承認カード（`approveToolExecution`）で行う。
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignCreate'
      responses:
        '201':
          description: 作成した施策
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /campaigns/{campaignId}:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
    get:
      tags: [campaigns]
      operationId: getCampaign
      summary: 施策詳細（SC-03）
      description: 承認情報、集計（投稿数・PV合計・流入ユーザー数合計）、画面で有効にできる操作（`allowed_actions`）を含む。関連投稿は `listPosts?campaign_id=`、関連記憶は `listMemories?campaign_id=` で取得する。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [campaigns]
      operationId: updateCampaign
      summary: 施策を編集する（SC-03）
      description: |
        指定した項目だけを更新する。内容が実際に変わった場合のみ `revision` が +1 される（変更なしなら `200` でそのまま返す）。

        **承認済み（`approved`）の施策の編集は承認を取り消す**（`status` → `pending_approval`、`approved_revision` / `approved_at` → `null`。戻り先は仮置き、`API_DESIGN.md` U-10）。
        画面の確認ダイアログを経たことを示すため、この場合は `acknowledge_approval_reset: true` が必須（なければ `409 APPROVAL_RESET_NOT_ACKNOWLEDGED`）。
        `archived` の施策は編集できない（`409 INVALID_STATE`）。
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignUpdate'
      responses:
        '200':
          description: 更新後の施策
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [campaigns]
      operationId: deleteCampaign
      summary: 施策を削除する
      description: |
        `draft` かつ紐づく投稿が0件の場合のみ削除できる。投稿が1件でもある場合は `409 CAMPAIGN_HAS_POSTS`（アーカイブへ誘導）。
        外部キーは `restrict` のため、投稿・記憶の紐づけ以外を持つ施策は物理削除しない。
        紐づく記憶との中間行（`memory_campaigns`）は連鎖削除されるが、記憶本体は残る。
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        '204':
          description: 削除した
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /campaigns/{campaignId}/submit:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
    post:
      tags: [campaigns]
      operationId: submitCampaign
      summary: 承認を申請する
      description: '`draft` または `rejected` → `pending_approval`。`submitted_at` を記録する。'
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevisionRequest'
      responses:
        '200':
          description: 更新後の施策
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /campaigns/{campaignId}/approve:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
    post:
      tags: [campaigns]
      operationId: approveCampaign
      summary: 施策を承認する（施策の確定）
      description: |
        `pending_approval` → `approved`。`approved_revision = revision`、`approved_at` を記録する。
        リクエストの `revision` がサーバーの改訂と一致しない場合（承認画面を開いたあとに編集された場合）は `409 REVISION_MISMATCH`。
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevisionRequest'
      responses:
        '200':
          description: 承認後の施策
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /campaigns/{campaignId}/reject:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
    post:
      tags: [campaigns]
      operationId: rejectCampaign
      summary: 施策を却下する
      description: '`pending_approval` → `rejected`。編集して再申請できる。却下理由を保存するカラムは現行DBにない。'
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevisionRequest'
      responses:
        '200':
          description: 却下後の施策
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /campaigns/{campaignId}/archive:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
    post:
      tags: [campaigns]
      operationId: archiveCampaign
      summary: 施策をアーカイブする
      description: '`archived` にして `archived_at` を記録する。紐づく投稿は変更しない。'
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        '200':
          description: アーカイブ後の施策
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /campaigns/{campaignId}/restore:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
    post:
      tags: [campaigns]
      operationId: restoreCampaign
      summary: アーカイブした施策を復元する
      description: '`archived` → `draft`（仮置き。承認は復元時に失われる。`API_DESIGN.md` U-12）。`archived_at` を `null` に戻す。'
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        '200':
          description: 復元後の施策
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # ------------------------------------------------------------------ posts
  /posts:
    get:
      tags: [posts]
      operationId: listPosts
      summary: 投稿一覧（SC-04）／施策に紐づく投稿（SC-03）
      description: |
        既定では `archived` を除外する。`needs_action=true` は「対応が必要」（`pending_approval` と `publish_failed`）だけを返す。
        `sort=attention` は対応が必要な投稿を先頭にピン留めする。
      parameters:
        - name: status
          in: query
          schema:
            type: array
            items:
              $ref: '#/components/schemas/PostStatus'
          style: form
          explode: false
        - name: campaign_id
          in: query
          schema:
            type: integer
            format: int64
        - name: needs_action
          in: query
          schema:
            type: boolean
        - name: include_archived
          in: query
          schema:
            type: boolean
            default: false
        - name: q
          in: query
          description: 本文の部分一致検索。
          schema:
            type: string
            maxLength: 255
        - name: sort
          in: query
          schema:
            type: string
            enum: [updated_at_desc, created_at_desc, published_at_desc, attention]
            default: updated_at_desc
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PostSummary'
                  next_cursor:
                    type: [string, 'null']
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [posts]
      operationId: createPost
      summary: 投稿を手動で作成する（SC-04「新規作成」）
      description: |
        `draft`、`revision = 1` で作成する。対象施策は `approved` のものだけ選べる（仮置き、`API_DESIGN.md` U-4）。満たさない場合は `422 CAMPAIGN_NOT_APPROVED`。
        `landing_url` を渡した場合は、UTM付きのトラッキングリンク（`post_tracking_links`）も同時に生成する。UTMは決定論的なアプリケーションロジックで生成し、LLMは呼ばない（NFR-COST-005）。
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostCreate'
      responses:
        '201':
          description: 作成した投稿
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /posts/{postId}:
    parameters:
      - $ref: '#/components/parameters/PostId'
    get:
      tags: [posts]
      operationId: getPost
      summary: 投稿詳細（SC-05）
      description: |
        本文、トラッキングリンク、承認情報、投稿結果、計測（`metric` と失敗履歴）、残り文字数、画面で有効にできる操作を返す。
        `publishing` 中の画面は、このエンドポイントを数秒ごとにポーリングして結果を反映する。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [posts]
      operationId: updatePost
      summary: 投稿を編集する（SC-05）
      description: |
        本文・投稿予定日（メモ）・遷移先URLを更新する。実際に内容が変わった場合のみ `revision` が +1 される。
        Xテキストの文字数規則を超える本文は `422 POST_BODY_TOO_LONG`。

        **承認済み（`approved`）の投稿の編集は承認を取り消す**（`status` → `pending_approval`。戻り先は仮置き、`API_DESIGN.md` U-10）。
        この場合は `acknowledge_approval_reset: true` が必須（なければ `409 APPROVAL_RESET_NOT_ACKNOWLEDGED`）。
        `publishing` / `published` / `archived` の投稿は編集できない（`409 INVALID_STATE`）。`publish_failed` は編集でき、編集すると再承認待ちに戻る。
        `landing_url` を変更するとUTM付きURL（`tracked_url`）を再生成する。
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostUpdate'
      responses:
        '200':
          description: 更新後の投稿
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
    delete:
      tags: [posts]
      operationId: deletePost
      summary: 投稿を削除する
      description: |
        `draft` の投稿だけ削除できる。公開済み（`published`）の投稿は削除できない（`409 POST_PUBLISHED_UNDELETABLE`）。
        それ以外の状態はアーカイブへ誘導する（`409 INVALID_STATE`）。トラッキングリンクは連鎖削除される。
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        '204':
          description: 削除した
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

