  # ------------------------------------------------------------------ memories
  /memories:
    get:
      tags: [memories]
      operationId: listMemories
      summary: 記憶一覧・意味検索（SC-07）
      description: |
        `q` なしは一覧（並びは `id` の降順。作成日時カラムがないため日付順は出せない。U-7）。
        `q` ありは、入力文の埋め込みを生成してベクトル検索し、類似度の降順で返す（エージェントの記憶想起と同じ検索）。
        検索時は埋め込み生成のため外部（埋め込みモデル）へ通信する。障害時は `502 UPSTREAM_ERROR`。
        `campaign_id` / `post_id` で、その施策・投稿に紐づく記憶だけに絞る。
      parameters:
        - name: q
          in: query
          description: 意味検索の入力文。
          schema:
            type: string
            minLength: 1
            maxLength: 500
        - name: campaign_id
          in: query
          schema:
            type: integer
            format: int64
        - name: post_id
          in: query
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK。`q` ありの場合は `similarity` を含み、`next_cursor` は常に `null`（上位 `limit` 件のみ）。
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Memory'
                  next_cursor:
                    type: [string, 'null']
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/UpstreamError'
    post:
      tags: [memories]
      operationId: createMemory
      summary: 覚えさせる（SC-07「覚えさせる」）
      description: |
        自然言語の記憶を保存する。埋め込みは、単一設定されたモデル・次元数で内容から生成する。
        埋め込みの生成に失敗した場合は何も保存せず `502 UPSTREAM_ERROR`。
        `campaign_ids` / `post_ids` は同じ会社の施策・投稿でなければならない（違反は `404`）。関連なしの記憶も保存できる。
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryCreate'
      responses:
        '201':
          description: 保存した記憶
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Memory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/UpstreamError'

  /memories/{memoryId}:
    parameters:
      - $ref: '#/components/parameters/MemoryId'
    get:
      tags: [memories]
      operationId: getMemory
      summary: 記憶の詳細
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Memory'
        '401':
