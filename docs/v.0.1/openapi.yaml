  # ------------------------------------------------------------------ internal
  /internal/jobs/metrics-collection:
    post:
      tags: [internal]
      operationId: runMetricsCollection
      summary: 施策評価ジョブ（投稿から7日後の計測）を実行する
      description: |
        cron等のスケジューラーが定期的に呼ぶ（要件7）。ユーザーセッションではなく `internalToken`（共有シークレット、またはプラットフォームのサービス認証）で認証する。

        対象: `post_metrics.status` が `pending`、または `failed` かつ再試行可能で上限未満、かつ `scheduled_at <= as_of` の投稿。
        各投稿について:
        1. `pending`/`failed` → `processing` へ**条件付きで原子的に**遷移させる（同時実行・重複起動でも1つのワーカーだけが処理する。NFR-REL-007）
        2. X APIから初週PV数、GA4から投稿経由の応募ページ流入ユーザー数を取得する
        3. 両方成功したら `completed`（両方の値と `measured_at` を保存）。失敗したら `post_metric_failures` に発生元・再試行可否・マスク済みエラーを追記し、`failed` にする
        4. 完了時に、評価結果を要約した記憶を保存し、施策・投稿に紐づける（決定論的なテンプレートで生成し、LLMは呼ばない。NFR-COST-005）

        一時的なエラー（HTTP 429 / 5xx / タイムアウト）は再試行可能とし、`post_metric_failures` の件数が上限（アプリケーション設定）に達したら再試行しない。恒久的なエラーは再試行しない。
        `post_metrics` は投稿IDが主キーのため、複数回実行しても同じ投稿の評価データは重複しない。
        一部の投稿の失敗はジョブ全体を失敗させない（`200` で件数を返す）。
      security:
        - internalToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                as_of:
                  type: string
                  format: date-time
                  description: 判定時刻。省略時は現在時刻。
                post_ids:
                  type: array
                  description: 対象を限定する（運用・検証用）。
                  items:
                    type: integer
                    format: int64
                dry_run:
                  type: boolean
                  default: false
                  description: 対象の抽出だけを行い、外部API呼び出しや保存はしない。
      responses:
        '200':
          description: 実行結果
          content:
            application/json:
              schema:
                type: object
                required: [as_of, targeted, completed, failed, skipped]
                properties:
                  as_of:
                    type: string
                    format: date-time
                  targeted:
                    type: integer
                    minimum: 0
                    description: 対象として抽出した投稿数。
                  completed:
                    type: integer
                    minimum: 0
                  failed:
                    type: integer
                    minimum: 0
                    description: 今回の実行で失敗（`failed` に遷移）した投稿数。
                  skipped:
                    type: integer
                    minimum: 0
                    description: 他のワーカーが処理中、または再試行上限に到達していたため処理しなかった投稿数。
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: hiromeru_session
      description: OIDCログイン後にサーバーが発行するセッションCookie（HttpOnly / Secure / SameSite=Lax）。
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: '`GET /me` の `csrf_token`。更新系（POST / PATCH / DELETE）で必須。'
    internalToken:
      type: http
      scheme: bearer
      description: 内部ジョブ用の共有シークレット。ユーザーセッションでは呼べない。

  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      description: 前回の `next_cursor`。不透明な文字列として扱う。
      schema:
        type: string
    From:
      name: from
      in: query
      description: 期間の開始（含む）。
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      description: 期間の終了（含まない）。
      schema:
        type: string
        format: date-time
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: クライアントが生成する一意なキー（UUID推奨）。24時間保持し、同じキーの再送は同じ結果を返す。
      schema:
        type: string
        minLength: 8
        maxLength: 255
    CampaignId:
      name: campaignId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    PostId:
      name: postId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    MemoryId:
      name: memoryId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    TurnId:
      name: turnId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ToolExecutionId:
      name: toolExecutionId
      in: path
      required: true
      schema:
        type: integer
        format: int64

  responses:
    BadRequest:
      description: リクエストの形式・値が不正（`VALIDATION_ERROR`）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: 未ログイン、またはセッションの期限切れ（`UNAUTHENTICATED`）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: CSRFトークン不正、無効化されたアカウントなど（`FORBIDDEN`, `CSRF_TOKEN_INVALID`, `ACCOUNT_DISABLED`）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: 存在しない、または他社のリソース（`NOT_FOUND`）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: 状態・改訂・冪等性の競合。`code` に理由を入れる（`REVISION_MISMATCH`, `INVALID_STATE`, `APPROVAL_RESET_NOT_ACKNOWLEDGED`, `NOT_APPROVED_REVISION`, `CAMPAIGN_HAS_POSTS`, `POST_PUBLISHED_UNDELETABLE`, `TURN_IN_PROGRESS`, `APPROVAL_PAYLOAD_CHANGED`, `IDEMPOTENCY_KEY_REUSED`）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: 形式は正しいが業務ルールに反する（`POST_BODY_TOO_LONG`, `CAMPAIGN_NOT_APPROVED`, `LANDING_URL_REQUIRED`, `INVALID_LANDING_URL`）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: レート制限（`RATE_LIMITED`）。`Retry-After` 秒後に再試行する。
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UpstreamError:
      description: 外部サービス（埋め込みモデル・X・LLM）の障害（`UPSTREAM_ERROR`）。認証情報などの機密はメッセージに含めない。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    # ------------------------------------------------------------ common
    Problem:
      type: object
      description: RFC 9457 Problem Details。
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
          description: エラー種別のURI（`about:blank` 可）。
          default: about:blank
        title:
          type: string
          description: 人が読める短い要約。
        status:
          type: integer
          description: HTTPステータスコード。
        code:
          $ref: '#/components/schemas/ErrorCode'
        detail:
          type: string
          description: 人が読める詳細（マスク済み）。
        instance:
          type: string
          description: 問題が発生したリクエストのパス。
        request_id:
          type: string
          description: ログとの突き合わせ用のリクエストID。
        errors:
          type: array
          description: フィールド単位のエラー（`VALIDATION_ERROR` など）。
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
                description: 'JSON Pointer 形式（例: `/body`）。'
              message:
                type: string
              code:
                type: string
        retryable:
          type: boolean
          description: 同じリクエストの再試行で成功する可能性があるか。
      examples:
        - type: about:blank
          title: 改訂が一致しません
          status: 409
          code: REVISION_MISMATCH
          detail: 表示中の改訂 r2 は最新ではありません（最新は r3）。画面を再読み込みしてください。
          request_id: req_01J8ZQ3
    ErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - UNAUTHENTICATED
        - FORBIDDEN
        - CSRF_TOKEN_INVALID
        - ACCOUNT_DISABLED
        - NOT_FOUND
        - REVISION_MISMATCH
        - INVALID_STATE
        - APPROVAL_RESET_NOT_ACKNOWLEDGED
        - NOT_APPROVED_REVISION
        - CAMPAIGN_HAS_POSTS
        - POST_PUBLISHED_UNDELETABLE
        - TURN_IN_PROGRESS
        - APPROVAL_PAYLOAD_CHANGED
        - IDEMPOTENCY_KEY_REUSED
        - POST_BODY_TOO_LONG
        - CAMPAIGN_NOT_APPROVED
        - LANDING_URL_REQUIRED
        - INVALID_LANDING_URL
        - RATE_LIMITED
        - UPSTREAM_ERROR
        - INTERNAL_ERROR
    Timestamp:
      type: string
      format: date-time
    LandingUrl:
      type: string
      format: uri
      maxLength: 2048
      description: 遷移先（応募ページ）のURL。`https://` のみ許可し、UTMなどのクエリは含めても含めなくてもよい（UTMは生成時に付与・上書きする）。
      pattern: '^https://'
      examples:
        - https://example.com/apply
    RevisionRequest:
      type: object
      required: [revision]
      properties:
        revision:
          type: integer
          minimum: 1
          description: 画面が表示していた改訂番号。サーバーの現在値と一致しなければ `409 REVISION_MISMATCH`。

    # ------------------------------------------------------------ me
    Me:
      type: object
      required: [user, company, marketer, csrf_token]
      properties:
        user:
          type: object
          required: [id, email, status]
          properties:
            id:
              type: integer
              format: int64
            email:
              type: string
              format: email
            status:
              type: string
              enum: [active, disabled]
        company:
          type: object
          required: [id, name]
          properties:
            id:
              type: integer
              format: int64
            name:
              type: string
        marketer:
          type: object
          required: [id]
          properties:
            id:
              type: integer
              format: int64
        csrf_token:
          type: string
    NavBadges:
      type: object
      required: [campaigns_pending_approval, posts_needs_action, metrics_failed, security_events_24h]
      properties:
        campaigns_pending_approval:
          type: integer
          minimum: 0
        posts_needs_action:
          type: integer
          minimum: 0
          description: '`pending_approval` と `publish_failed` の合計。'
        metrics_failed:
          type: integer
          minimum: 0
        security_events_24h:
          type: integer
          minimum: 0
    ClientConfig:
      type: object
      required: [post_text_weighted_limit, jpy_per_usd]
      properties:
        post_text_weighted_limit:
          type: integer
          description: 'Xテキスト投稿の文字数上限（重み付き）。文字数の数え方はXの規則に従う（URLは固定長で数える等）。現行値は実装時に確認する。'
          examples:
            - 280
        jpy_per_usd:
          type: number
          description: 円換算に使う固定レート（U-8。出所は未確定）。
          examples:
            - 150
        memory_max_length:
          type: integer
          description: 記憶1件の最大文字数（仮置き）。
          examples:
            - 2000

    # ------------------------------------------------------------ campaigns
    CampaignStatus:
      type: string
      enum: [draft, pending_approval, approved, rejected, archived]
    CampaignAction:
      type: string
      description: 画面で有効にできる操作（サーバーが状態から算出する）。
      enum: [edit, submit, approve, reject, archive, restore, delete, create_post]
    CampaignFields:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        target_profile:
          type: string
          minLength: 1
          description: ターゲット像。施策でリーチする対象者の属性、状況、課題、動機。
        background:
          type: string
          minLength: 1
          description: 実施背景。
        objective:
          type: string
          minLength: 1
          description: 施策目的。
        plan:
          type: string
          minLength: 1
          description: 施策内容。
    CampaignSummary:
      type: object
      required: [id, title, status, revision, post_count, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        status:
          $ref: '#/components/schemas/CampaignStatus'
        revision:
          type: integer
          minimum: 1
        approved_revision:
          type: [integer, 'null']
        post_count:
          type: integer
          minimum: 0
          description: 紐づく投稿数（`archived` を除く）。
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        archived_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    CampaignCreate:
      allOf:
        - $ref: '#/components/schemas/CampaignFields'
        - type: object
          required: [title, target_profile, background, objective, plan]
    CampaignUpdate:
      allOf:
        - $ref: '#/components/schemas/CampaignFields'
        - type: object
          required: [expected_revision]
          properties:
            expected_revision:
              type: integer
              minimum: 1
              description: 編集開始時に表示していた改訂番号。
            acknowledge_approval_reset:
              type: boolean
              default: false
              description: 承認済みの施策を編集して承認が取り消されることをユーザーが確認済みか。
    CampaignDetail:
      type: object
      required: [id, title, target_profile, background, objective, plan, status, revision, allowed_actions, stats, created_by_marketer_id, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        target_profile:
          type: string
        background:
          type: string
        objective:
          type: string
        plan:
          type: string
        status:
          $ref: '#/components/schemas/CampaignStatus'
        revision:
          type: integer
          minimum: 1
        approved_revision:
          type: [integer, 'null']
          description: 承認済みでは `revision` と一致する。
        submitted_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        approved_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        archived_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        created_by_marketer_id:
          type: integer
          format: int64
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        allowed_actions:
          type: array
          items:
            $ref: '#/components/schemas/CampaignAction'
        stats:
          type: object
          description: 集計（SC-03 の「集計」）。
          required: [post_count, published_post_count, x_pv_total, landing_user_total]
          properties:
            post_count:
              type: integer
              minimum: 0
            published_post_count:
              type: integer
              minimum: 0
            x_pv_total:
              type: integer
              minimum: 0
              description: 計測完了の投稿の初週PV数の合計。
            landing_user_total:
              type: integer
              minimum: 0
              description: 計測完了の投稿の流入ユーザー数の合計。
            measured_post_count:
              type: integer
              minimum: 0
              description: 計測完了の投稿数。

    # ------------------------------------------------------------ posts
    PostStatus:
      type: string
      enum: [draft, pending_approval, approved, publishing, published, publish_failed, archived]
    PostAction:
      type: string
      enum: [edit, submit, approve, publish, republish, archive, restore, delete, open_on_x, view_metrics]
    PostFields:
      type: object
      properties:
        body:
          type: string
          minLength: 1
          description: 投稿本文（Xのテキスト文字数規則をサーバーで検証する）。
        scheduled_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
          description: 投稿予定日時（**メモ**。自動投稿はしない）。
        landing_url:
          $ref: '#/components/schemas/LandingUrl'
    TrackingLink:
      type: object
      required: [landing_url, utm_source, utm_medium, utm_campaign, utm_content, tracked_url, publish_text]
      properties:
        landing_url:
          $ref: '#/components/schemas/LandingUrl'
        utm_source:
          type: string
          examples:
            - x
        utm_medium:
          type: string
          examples:
            - social
        utm_campaign:
          type: string
          examples:
            - c8
        utm_content:
          type: string
          examples:
            - p12
        utm_term:
          type: [string, 'null']
        tracked_url:
          type: string
          format: uri
          description: UTMを付与した遷移先URL。
          examples:
            - https://example.com/apply?utm_source=x&utm_medium=social&utm_campaign=c8&utm_content=p12
        publish_text:
          type: string
          description: Xへ送る最終テキスト（本文にUTM付きURLを結合したもの。結合規則は仮置き、U-13）。
    TextLength:
      type: object
      required: [weighted_length, limit, remaining]
      properties:
        weighted_length:
          type: integer
          minimum: 0
        limit:
          type: integer
        remaining:
          type: integer
          description: 上限までの残り。超過時は負数。
    PostSummary:
      type: object
      required: [id, campaign_id, campaign_title, body_excerpt, status, revision, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        campaign_id:
          type: integer
          format: int64
        campaign_title:
          type: string
        body_excerpt:
          type: string
          description: 本文の冒頭（1行、最大80文字程度）。
        status:
          $ref: '#/components/schemas/PostStatus'
        revision:
          type: integer
          minimum: 1
        approved_revision:
          type: [integer, 'null']
        scheduled_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        published_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        x_pv_count:
          type: [integer, 'null']
          description: 初週PV数（計測完了のもののみ。それ以外は `null`）。
        metric_status:
          oneOf:
            - $ref: '#/components/schemas/PostMetricStatus'
            - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    PostCreate:
      allOf:
        - $ref: '#/components/schemas/PostFields'
        - type: object
          required: [campaign_id, body]
          properties:
            campaign_id:
              type: integer
              format: int64
    PostUpdate:
      allOf:
        - $ref: '#/components/schemas/PostFields'
        - type: object
          required: [expected_revision]
          properties:
            expected_revision:
              type: integer
              minimum: 1
            acknowledge_approval_reset:
              type: boolean
              default: false
              description: 承認済みの投稿を編集して承認が取り消されることをユーザーが確認済みか。
    PostDetail:
      type: object
      required: [id, campaign_id, campaign_title, body, status, revision, text_length, allowed_actions, created_by_marketer_id, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        campaign_id:
          type: integer
          format: int64
        campaign_title:
          type: string
        body:
          type: string
        status:
          $ref: '#/components/schemas/PostStatus'
        revision:
          type: integer
          minimum: 1
        approved_revision:
          type: [integer, 'null']
          description: Xへ投稿できるのは `approved_revision = revision` のときだけ。
        scheduled_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        approved_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        published_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        x_post_id:
          type: [string, 'null']
        x_post_url:
          type: [string, 'null']
          format: uri
          description: 「Xで開く」リンク（`x_post_id` から生成）。
        last_publish_error:
          type: [string, 'null']
          description: 失敗時のマスク済みエラー（認証情報・トークンは含まない）。
        archived_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        created_by_marketer_id:
          type: integer
          format: int64
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        text_length:
          $ref: '#/components/schemas/TextLength'
        tracking_link:
          oneOf:
            - $ref: '#/components/schemas/TrackingLink'
            - type: 'null'
          description: 遷移先URL未設定の間は `null`。
        metric:
          oneOf:
            - $ref: '#/components/schemas/PostMetric'
            - type: 'null'
          description: 公開前は `null`。
        metric_failures:
          type: array
          items:
            $ref: '#/components/schemas/MetricFailure'
        has_memory:
          type: boolean
          description: この投稿に紐づく記憶が存在するか（SC-06 の「記憶に保存されました」表示用）。
        allowed_actions:
          type: array
          items:
            $ref: '#/components/schemas/PostAction'

    # ------------------------------------------------------------ metrics
    PostMetricStatus:
      type: string
      enum: [pending, processing, completed, failed]
    MetricFailureSource:
      type: string
      enum: [x, ga4, system]
    PostMetric:
      type: object
      required: [post_id, scheduled_at, status]
      properties:
        post_id:
          type: integer
          format: int64
        scheduled_at:
          $ref: '#/components/schemas/Timestamp'
          description: 計測予定日時（公開から7日後）。
        status:
          $ref: '#/components/schemas/PostMetricStatus'
        x_pv_count:
          type: [integer, 'null']
          minimum: 0
          description: X投稿の初週PV数（表示回数）。`completed` のときのみ非 `null`。
        landing_user_count:
          type: [integer, 'null']
          minimum: 0
          description: 投稿経由で応募ページへ流入したユーザー数。`completed` のときのみ非 `null`。
        measured_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    MetricFailure:
      type: object
      required: [id, post_id, source, error_message, retryable, failed_at]
      properties:
        id:
          type: integer
          format: int64
        post_id:
          type: integer
          format: int64
        source:
          $ref: '#/components/schemas/MetricFailureSource'
        error_code:
          type: [string, 'null']
        error_message:
          type: string
          description: マスク済みのエラー（認証情報・トークンは含まない）。
        retryable:
          type: boolean
        failed_at:
          $ref: '#/components/schemas/Timestamp'
    MetricsReport:
      type: object
      required: [campaigns]
      properties:
        campaigns:
          type: array
          description: 施策ごとのグループ（投稿がある施策のみ。並びは最新の投稿日の降順）。
          items:
            type: object
            required: [campaign, totals, posts]
            properties:
              campaign:
                type: object
                required: [id, title, status]
                properties:
                  id:
                    type: integer
                    format: int64
                  title:
                    type: string
                  status:
                    $ref: '#/components/schemas/CampaignStatus'
              totals:
                type: object
                required: [measured_post_count, x_pv_total, landing_user_total]
                properties:
                  measured_post_count:
                    type: integer
                    minimum: 0
                  x_pv_total:
                    type: integer
                    minimum: 0
                  landing_user_total:
                    type: integer
                    minimum: 0
              posts:
                type: array
                items:
                  type: object
                  required: [post_id, body_excerpt, post_status, failure_count, has_memory]
                  properties:
                    post_id:
                      type: integer
                      format: int64
                    body_excerpt:
                      type: string
                    post_status:
                      $ref: '#/components/schemas/PostStatus'
                    published_at:
                      oneOf:
                        - $ref: '#/components/schemas/Timestamp'
                        - type: 'null'
                    metric:
                      oneOf:
                        - $ref: '#/components/schemas/PostMetric'
                        - type: 'null'
                    latest_failure:
                      oneOf:
                        - $ref: '#/components/schemas/MetricFailure'
                        - type: 'null'
                    failure_count:
                      type: integer
                      minimum: 0
                    has_memory:
                      type: boolean

    # ------------------------------------------------------------ memories
    Memory:
      type: object
      required: [id, content, campaigns, posts]
      properties:
        id:
          type: integer
          format: int64
        content:
          type: string
        campaigns:
          type: array
          description: 紐づく施策（0件でも可）。
          items:
            type: object
            required: [id, title]
            properties:
              id:
                type: integer
                format: int64
              title:
                type: string
        posts:
          type: array
          description: 紐づく投稿（0件でも可）。
          items:
            type: object
            required: [id, body_excerpt]
            properties:
              id:
                type: integer
                format: int64
              body_excerpt:
                type: string
        similarity:
          type: number
          minimum: 0
          maximum: 1
          description: 意味検索（`q` 指定）のときだけ含む。コサイン類似度。
    MemoryCreate:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 2000
          description: 覚えさせる自然言語。保存前に機密値をマスクする（NFR-SEC-002）。
        campaign_ids:
          type: array
          items:
            type: integer
            format: int64
          uniqueItems: true
        post_ids:
          type: array
          items:
            type: integer
            format: int64
          uniqueItems: true

    # ------------------------------------------------------------ agents / chat
    AgentType:
      type: string
      enum: [parent, campaign_planner, content_creator]
    AgentSessionStatus:
      type: string
      enum: [active, archived]
    AgentTurnStatus:
      type: string
      enum: [pending, running, completed, failed, cancelled, blocked]
    AgentItemType:
      type: string
      enum: [user_message, assistant_message, tool_call, tool_result]
    AgentContentSource:
      type: string
      enum: [user_input, user_document, agent_output, web_content, web_search, database, long_term_memory, external_api, mcp_tool, system]
    AgentContextClass:
      type: string
      enum: [conversation, untrusted_data]
    ToolExecutionStatus:
      type: string
      enum: [pending, running, waiting_for_approval, completed, failed, cancelled, blocked]
    TurnErrorCode:
      type: string
      description: |
        ターンの終了理由。上限到達は `STEP_LIMIT` / `COST_LIMIT`。それ以外は実装で拡張する。
      examples:
        - STEP_LIMIT
    ChatSession:
      type: object
      required: [id, status, created_at, updated_at, pending_approval_count]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/AgentSessionStatus'
        pending_approval_count:
          type: integer
          minimum: 0
          description: この会話で承認待ちの承認カードの数。
        last_turn_status:
          oneOf:
            - $ref: '#/components/schemas/AgentTurnStatus'
            - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        archived_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    ChatTurnCreate:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 8000
          description: ユーザーのメッセージ。送信前に機密値をマスクする（NFR-SEC-002）。
        context:
          type: object
          description: '画面から渡す文脈（例: 「この施策で投稿案を作る」）。'
          properties:
            campaign_id:
              type: integer
              format: int64
            post_id:
              type: integer
              format: int64
    ApprovalKind:
      type: string
      enum: [campaign_commit, post_content_commit, x_publish, data_delete]
    ApprovalRequest:
      type: object
      description: 承認カード。`tool_executions.status = waiting_for_approval` のツール実行に対応する。
      required: [kind, summary, payload, payload_hash]
      properties:
        kind:
          $ref: '#/components/schemas/ApprovalKind'
        summary:
          type: string
          description: 'カードの見出し（例: 「施策案（未承認）」「Xに投稿」）。'
        payload:
          oneOf:
            - $ref: '#/components/schemas/CampaignCommitPayload'
            - $ref: '#/components/schemas/PostContentCommitPayload'
            - $ref: '#/components/schemas/XPublishPayload'
            - $ref: '#/components/schemas/DataDeletePayload'
          discriminator:
            propertyName: kind
            mapping:
              campaign_commit: '#/components/schemas/CampaignCommitPayload'
              post_content_commit: '#/components/schemas/PostContentCommitPayload'
              x_publish: '#/components/schemas/XPublishPayload'
              data_delete: '#/components/schemas/DataDeletePayload'
        payload_hash:
          type: string
          description: '`payload` の正規化JSONのSHA-256。承認時に返し、画面表示と実行内容の一致を保証する。'
    CampaignCommitPayload:
      allOf:
        - $ref: '#/components/schemas/CampaignFields'
        - type: object
          required: [kind, title, target_profile, background, objective, plan]
          properties:
            kind:
              type: string
              const: campaign_commit
            campaign_id:
              type: [integer, 'null']
              format: int64
              description: 既存施策の更新なら対象ID、新規なら `null`。
            expected_revision:
              type: [integer, 'null']
              description: 既存施策の更新時に、提案の元になった改訂番号。
    PostContentCommitPayload:
      type: object
      required: [kind, campaign_id, body, landing_url, tracked_url_preview]
      properties:
        kind:
          type: string
          const: post_content_commit
        post_id:
          type: [integer, 'null']
          format: int64
          description: 既存投稿の更新なら対象ID、新規なら `null`。
        campaign_id:
          type: integer
          format: int64
        campaign_title:
          type: string
        body:
          type: string
        text_length:
          $ref: '#/components/schemas/TextLength'
        landing_url:
          $ref: '#/components/schemas/LandingUrl'
        tracked_url_preview:
          type: string
          format: uri
        scheduled_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    XPublishPayload:
      type: object
      required: [kind, post_id, revision, body, tracked_url]
      properties:
        kind:
          type: string
          const: x_publish
        post_id:
          type: integer
          format: int64
        revision:
          type: integer
          minimum: 1
          description: 承認済み改訂。実行時に `approved_revision = revision` を再検証する。
        campaign_title:
          type: string
        body:
          type: string
        tracked_url:
          type: string
          format: uri
        notice:
          type: string
          description: 「投稿は公開されます。取り消せません」などの注意。
    DataDeletePayload:
      type: object
      required: [kind, resource_type, resource_id, impact]
      properties:
        kind:
          type: string
          const: data_delete
        resource_type:
          type: string
          enum: [memory, campaign, post]
        resource_id:
          type: integer
          format: int64
        label:
          type: string
          description: 削除対象の表示名（記憶の冒頭、施策タイトルなど）。
        impact:
          type: string
          description: '影響範囲（例: 「内容と埋め込みベクトルを完全に削除します。元に戻せません」）。'
    ToolExecution:
      type: object
      required: [id, tool_call_item_id, status, attempt_count, created_at]
      properties:
        id:
          type: integer
          format: int64
        tool_call_item_id:
          type: integer
          format: int64
        tool_name:
          type: string
        status:
          $ref: '#/components/schemas/ToolExecutionStatus'
        attempt_count:
          type: integer
          minimum: 0
        created_at:
          $ref: '#/components/schemas/Timestamp'
        completed_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        session_id:
          type: integer
          format: int64
          description: 承認待ち一覧で、どの会話のカードかを示す。
        approval:
          oneOf:
            - $ref: '#/components/schemas/ApprovalRequest'
            - type: 'null'
          description: 承認が必要なツール実行のときだけ非 `null`。
        result_summary:
          type: [string, 'null']
          description: 完了・失敗・却下後の結果の要約（マスク済み）。
    ChatItem:
      type: object
      description: |
        会話の1要素。`display = omitted` の場合は `content` を返さない（隔離済み。「安全のため表示を省略しました」）。
        `content` の形は `item_type` による。
        - `user_message`: `{ text, context? }`
        - `assistant_message`: `{ text }`
        - `tool_call`: `{ call_id, tool_name, arguments, child_session_id? }`
        - `tool_result`: `{ call_id, status: success|error|rejected|blocked, output?, error?: {code, message, retryable}, child_session_id? }`
      required: [id, item_number, item_type, agent, display, created_at]
      properties:
        id:
          type: integer
          format: int64
        item_number:
          type: integer
          minimum: 1
        item_type:
          $ref: '#/components/schemas/AgentItemType'
        agent:
          $ref: '#/components/schemas/AgentType'
          description: このアイテムを持つセッションのエージェント（発話者ラベル用）。
        display:
          type: string
          enum: [normal, omitted]
        content:
          type: [object, 'null']
          additionalProperties: true
        related_tool_call_item_id:
          type: [integer, 'null']
          format: int64
        tool_execution:
          oneOf:
            - $ref: '#/components/schemas/ToolExecution'
            - type: 'null'
          description: '`tool_call` のときのみ。'
        created_at:
          $ref: '#/components/schemas/Timestamp'
    ChatTurn:
      type: object
      required: [id, session_id, turn_number, status, items, usage]
      properties:
        id:
          type: integer
          format: int64
        session_id:
          type: integer
          format: int64
        turn_number:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/AgentTurnStatus'
        waiting_for_approval:
          type: boolean
          description: '`running` のまま、承認カードの承認待ちで止まっているか（`API_DESIGN.md` U-15）。'
        error_code:
          oneOf:
            - $ref: '#/components/schemas/TurnErrorCode'
            - type: 'null'
        error_message:
          type: [string, 'null']
          description: マスク済みの理由。
        started_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        completed_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        usage:
          type: object
          description: ターンフッターの「コスト・所要時間」（関連するLLM呼び出しの合計）。
          required: [cost_usd, response_time_ms, llm_call_count]
          properties:
            cost_usd:
              type: [number, 'null']
              minimum: 0
              description: 合計コスト（USD）。コスト未取得の呼び出しだけなら `null`。
            response_time_ms:
              type: integer
              minimum: 0
            llm_call_count:
              type: integer
              minimum: 0
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChatItem'
        children:
          type: array
          description: '`expand_children=true` のとき、このターンが呼び出したサブエージェントのセッション（インライン展開用）。'
          items:
            type: object
            required: [session_id, agent, turns]
            properties:
              session_id:
                type: integer
                format: int64
              agent:
                $ref: '#/components/schemas/AgentType'
              turns:
                type: array
                items:
                  type: object
                  required: [id, turn_number, status, items]
                  properties:
                    id:
                      type: integer
                      format: int64
                    turn_number:
                      type: integer
                    status:
                      $ref: '#/components/schemas/AgentTurnStatus'
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/ChatItem'
    ApprovalResult:
      type: object
      required: [tool_execution]
      properties:
        tool_execution:
          $ref: '#/components/schemas/ToolExecution'
        effect:
          type: [object, 'null']
          description: 承認によって作成・更新・削除された業務データ（却下時は `null`）。
          required: [resource_type, resource_id, action]
          properties:
            resource_type:
              type: string
              enum: [campaign, post, memory]
            resource_id:
              type: integer
              format: int64
            action:
              type: string
              enum: [created, updated, deleted, publishing]
            revision:
              type: [integer, 'null']
        next_turn:
          oneOf:
            - $ref: '#/components/schemas/ChatTurn'
            - type: 'null'
          description: 「修正を依頼」で開始した新しいターン。

    # ------------------------------------------------------------ ops
    CostSummary:
      type: object
      required: [from, to, total_cost_usd, llm_call_count, success_rate, calls_without_cost_count, by_day, by_agent]
      properties:
        from:
          $ref: '#/components/schemas/Timestamp'
        to:
          $ref: '#/components/schemas/Timestamp'
        total_cost_usd:
          type: number
          minimum: 0
        llm_call_count:
          type: integer
          minimum: 0
        success_rate:
          type: [number, 'null']
          minimum: 0
          maximum: 1
          description: 呼び出しが0件なら `null`。
        avg_response_time_ms:
          type: [integer, 'null']
          minimum: 0
        calls_without_cost_count:
          type: integer
          minimum: 0
          description: 失敗などでコストが取得できなかった呼び出し数（注記用）。
        limit_terminated_turn_count:
          type: integer
          minimum: 0
          description: ステップ数・コスト上限到達で終了したターン数（失敗一覧とは区別してカウント）。
        by_day:
          type: array
          items:
            type: object
            required: [date, cost_usd, llm_call_count]
            properties:
              date:
                type: string
                format: date
              cost_usd:
                type: number
                minimum: 0
              llm_call_count:
                type: integer
                minimum: 0
        by_agent:
          type: array
          items:
            type: object
            required: [agent, cost_usd, llm_call_count]
            properties:
              agent:
                $ref: '#/components/schemas/AgentType'
              cost_usd:
                type: number
                minimum: 0
              llm_call_count:
                type: integer
                minimum: 0
    LlmCall:
      type: object
      required: [id, turn_id, session_id, agent, succeeded, called_at]
      properties:
        id:
          type: integer
          format: int64
        turn_id:
          type: integer
          format: int64
        session_id:
          type: integer
          format: int64
        agent:
          $ref: '#/components/schemas/AgentType'
        input_tokens:
          type: [integer, 'null']
          minimum: 0
        output_tokens:
          type: [integer, 'null']
          minimum: 0
        cost_usd:
          type: [number, 'null']
          minimum: 0
          description: OrcaRouterが返す確定請求額。取得できなかった場合は `null`。
        response_time_ms:
          type: [integer, 'null']
          minimum: 0
        succeeded:
          type: boolean
        error_code:
          type: [string, 'null']
        error_message:
          type: [string, 'null']
        orcarouter_request_id:
          type: [string, 'null']
        model:
          type: [string, 'null']
          description: 使用モデル。**現行DBに保存先がなく常に `null`**（U-5。カラム追加またはOrcaRouterへの照会が決まったら返す）。
        called_at:
          $ref: '#/components/schemas/Timestamp'
    OpsSession:
      type: object
      required: [id, agent, status, turn_count, failed_turn_count, blocked_turn_count, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        agent:
          $ref: '#/components/schemas/AgentType'
        title:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/AgentSessionStatus'
        parent_session_id:
          type: [integer, 'null']
          format: int64
        turn_count:
          type: integer
          minimum: 0
        failed_turn_count:
          type: integer
          minimum: 0
        blocked_turn_count:
          type: integer
          minimum: 0
        security_event_count:
          type: integer
          minimum: 0
        cost_usd_total:
          type: [number, 'null']
          minimum: 0
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    OpsTurnSummary:
      type: object
      required: [id, session_id, turn_number, status, llm_call_count]
      properties:
        id:
          type: integer
          format: int64
        session_id:
          type: integer
          format: int64
        turn_number:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/AgentTurnStatus'
        error_code:
          type: [string, 'null']
        error_message:
          type: [string, 'null']
        started_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        completed_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        cost_usd:
          type: [number, 'null']
          minimum: 0
        llm_call_count:
          type: integer
          minimum: 0
        item_count:
          type: integer
          minimum: 0
    OpsItem:
      type: object
      required: [id, item_number, item_type, context_class, content_source, context_status, created_at]
      properties:
        id:
          type: integer
          format: int64
        item_number:
          type: integer
          minimum: 1
        item_type:
          $ref: '#/components/schemas/AgentItemType'
        context_class:
          $ref: '#/components/schemas/AgentContextClass'
        content_source:
          $ref: '#/components/schemas/AgentContentSource'
        context_status:
          type: string
          enum: [active, quarantined]
        quarantine_reason:
          type: [string, 'null']
        quarantined_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        content:
          type: [object, 'null']
          additionalProperties: true
          description: マスク済みの内容。**`quarantined` のアイテムでは返さない**（`null`）。
        context_override:
          type: [object, 'null']
          additionalProperties: true
          description: 隔離済みアイテムで、LLMに渡された安全な代替内容。
        related_tool_call_item_id:
          type: [integer, 'null']
          format: int64
        llm_call_id:
          type: [integer, 'null']
          format: int64
        child_session_id:
          type: [integer, 'null']
          format: int64
          description: サブエージェントを呼び出した `tool_call` / `tool_result` から子セッションへのリンク。
        created_at:
          $ref: '#/components/schemas/Timestamp'
    OpsTurn:
      allOf:
        - $ref: '#/components/schemas/OpsTurnSummary'
        - type: object
          required: [items, tool_executions, llm_calls, security_events]
          properties:
            agent:
              $ref: '#/components/schemas/AgentType'
            items:
              type: array
              items:
                $ref: '#/components/schemas/OpsItem'
            tool_executions:
              type: array
              items:
                $ref: '#/components/schemas/ToolExecution'
            llm_calls:
              type: array
              items:
                $ref: '#/components/schemas/LlmCall'
            security_events:
              type: array
              items:
                $ref: '#/components/schemas/SecurityEvent'
    SecurityEventType:
      type: string
      enum: [prompt_injection, sensitive_data, unauthorized_tool_call, unsafe_external_action]
    SecurityDetector:
      type: string
      enum: [application, orcarouter_guardrail, orcarouter_firewall]
    SecurityEnforcement:
      type: string
      enum: [observed, sanitized, blocked]
    SecurityEvent:
      type: object
      required: [id, turn_id, session_id, event_type, detector, source, enforcement, summary, metadata, detected_at]
      properties:
        id:
          type: integer
          format: int64
        turn_id:
          type: integer
          format: int64
        session_id:
          type: integer
          format: int64
        item_id:
          type: [integer, 'null']
          format: int64
        llm_call_id:
          type: [integer, 'null']
          format: int64
        event_type:
          $ref: '#/components/schemas/SecurityEventType'
        detector:
          $ref: '#/components/schemas/SecurityDetector'
        source:
          $ref: '#/components/schemas/AgentContentSource'
        enforcement:
          $ref: '#/components/schemas/SecurityEnforcement'
        external_event_id:
          type: [string, 'null']
          description: OrcaRouterのMatch IDまたはFirewall Event ID。アプリケーション検出時は `null`。
        summary:
          type: string
          description: マスク済みの概要。検出した機密値そのものは含まれない。
        metadata:
          type: object
          additionalProperties: true
          description: 許可リストに含まれるマスク済みの診断値のみ（生の一致内容は含まない）。
        detected_at:
          $ref: '#/components/schemas/Timestamp'
