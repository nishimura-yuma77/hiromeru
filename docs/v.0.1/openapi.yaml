        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /posts/{postId}/publish:
    parameters:
      - $ref: '#/components/parameters/PostId'
    post:
      tags: [posts]
      operationId: publishPost
      summary: Xに投稿する
      description: |
        SC-05「今すぐ投稿」（確認ダイアログの後）。**即時投稿のみ**で、`scheduled_at` による自動投稿はしない。

        事前条件（すべて満たさない場合は `409 NOT_APPROVED_REVISION`）:
        - `status` が `approved`（または `publish_failed` の再投稿で、承認済み改訂のまま）
        - `approved_revision = revision`、かつリクエストの `revision` と一致する

        処理:
        1. 状態を `publishing` に**原子的に**遷移させる（二重押し・二重リクエスト対策。同時に1つだけが成功する）
        2. `202 Accepted` を返す
        3. バックグラウンドでX APIへ投稿する。成功すると `published`、`published_at`、`x_post_id` を記録し、計測予定日時（`published_at` の7日後）で `post_metrics` を `pending` として作成する。失敗すると `publish_failed` とマスク済みの `last_publish_error` を記録する
        4. クライアントは `getPost` をポーリングして結果を反映する

        同じ `Idempotency-Key` での再送は、現在の投稿を同じ `202` で返す（再投稿しない）。同じキーで別の投稿・別の `revision` を指定した場合は `409 IDEMPOTENCY_KEY_REUSED`。
        X APIの応答が得られずに投稿結果が不明な場合は、自動で再送せず `publish_failed`（エラー概要に「結果不明」）とし、ユーザーの確認を経て再投稿する（`API_DESIGN.md` §4.2）。
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevisionRequest'
      responses:
        '202':
          description: 受け付けた（`status = publishing`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /posts/{postId}/archive:
    parameters:
      - $ref: '#/components/parameters/PostId'
    post:
      tags: [posts]
      operationId: archivePost
      summary: 投稿をアーカイブする
      description: '`draft` / `pending_approval` / `approved` / `publish_failed` → `archived`。`publishing` と `published` はアーカイブできない。'
      security:
