        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /chat/sessions/{sessionId}/turns:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [chat]
      operationId: listChatTurns
      summary: 会話のターンとアイテムを取得する（SC-01 メッセージ表示）
      description: |
        ターン番号の昇順で、各ターンのアイテム（発話・ツール実行）と承認カードを返す。会話を開き直したときの復元にも使う。
        `before_turn_number` を指定すると、それより前のターンを新しい順に `limit` 件（過去へのスクロール用）。
        サブエージェントの作業は `expand_children=true` でインライン展開用に含める。
        **隔離済み（`quarantined`）のアイテムは、内容を返さず `display = omitted` とする**（「安全のため表示を省略しました」）。
      parameters:
        - name: before_turn_number
          in: query
          schema:
            type: integer
            minimum: 1
        - name: expand_children
          in: query
          schema:
            type: boolean
            default: true
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: OK（`turns` は `turn_number` の昇順）
          content:
            application/json:
              schema:
                type: object
                required: [turns, has_more]
                properties:
                  turns:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChatTurn'
                  has_more:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [chat]
      operationId: createChatTurn
      summary: メッセージを送る（ターンを開始する）
      description: |
        ユーザーメッセージを追加して、エージェントループ（ターン）を開始する。**応答を待たず `202` を返し**、進捗は `streamChatTurn`（SSE）で受け取る（NFR-PERF-001）。
        `context` は「この施策で投稿案を作る」など、画面から渡す文脈（`user_message` の内容に保存される）。対象は同じ会社の施策・投稿のみ。

        同じ会話に実行中のターンがある場合は `409 TURN_IN_PROGRESS`。
        ただし、直前のターンが**承認カードの承認待ち**で止まっている場合は、送信したメッセージを「修正を依頼」とみなし、待機中の承認をすべて却下（`cancelled`）してそのターンを `cancelled` で閉じ、新しいターンを開始する。
        ターンにはステップ数とコストの上限（アプリケーション設定）があり、到達するとターンは `failed`（`error_code = STEP_LIMIT` / `COST_LIMIT`）で終了する。
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatTurnCreate'
      responses:
        '202':
          description: 受け付けた（ターンは `pending` または `running`）
          headers:
            Location:
              description: ターンのストリーム（`streamChatTurn`）
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatTurn'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /chat/turns/{turnId}:
    parameters:
      - $ref: '#/components/parameters/TurnId'
    get:
      tags: [chat]
      operationId: getChatTurn
      summary: ターンの状態とアイテム
      description: ストリームが切れたときの再同期や、ポーリングに使う。返す内容は `listChatTurns` の1要素と同じ。
      parameters:
        - name: expand_children
          in: query
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatTurn'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /chat/turns/{turnId}/events:
    parameters:
      - $ref: '#/components/parameters/TurnId'
    get:
      tags: [chat]
      operationId: streamChatTurn
      summary: ターンの進捗を受け取る（Server-Sent Events）
      description: |
        `Content-Type: text/event-stream`。ターンが終端状態（`completed` / `failed` / `cancelled` / `blocked`）になるとサーバーが接続を閉じる。
        終端後に接続した場合は、終端イベントを1件返して閉じる。

        各イベントは `id`（ターン内で単調増加）・`event`・`data`（JSON）を持つ。切断時は `Last-Event-ID` ヘッダーで途中から再開できる（保持期間を過ぎた場合は `getChatTurn` で再同期）。
        30秒ごとにコメント行（`: ping`）を送る。

        | event | data | 用途 |
        |-------|------|------|
        | `turn.started` | `ChatTurn` | 「考え中…」表示の開始 |
        | `message.delta` | `{item_key, agent, text}` | アシスタント発話のストリーミング（確定前の差分。`item.created` で確定） |
        | `item.created` | `ChatItem` | 発話・ツール呼び出し・ツール結果の確定 |
        | `tool_execution.updated` | `ToolExecution` | ツール実行の状態変化（実行中／完了／失敗／ブロック） |
        | `approval.requested` | `ToolExecution`（`approval` を含む） | 承認カードの表示 |
        | `item.context_status_changed` | `{item_id, display}` | 検出により隔離された（内容を「省略」表示へ切替） |
        | `usage.updated` | `{cost_usd, response_time_ms, llm_call_count}` | ターンフッターのコスト・所要時間 |
        | `turn.completed` / `turn.failed` / `turn.cancelled` / `turn.blocked` | `ChatTurn` | 終端 |
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: イベントストリーム
          content:
            text/event-stream:
              schema:
                type: string
                description: 上表のイベントをSSE形式で連続して送る。
                examples:
                  - |
                    id: 3
                    event: item.created
                    data: {"id":9101,"item_number":3,"item_type":"tool_call","agent":"parent","display":"normal","content":{"call_id":"call_1","tool_name":"search_memories","arguments":{"query":"エンジニア採用 反応が良かった投稿"}}}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /chat/turns/{turnId}/cancel:
    parameters:
      - $ref: '#/components/parameters/TurnId'
    post:
      tags: [chat]
      operationId: cancelChatTurn
      summary: 実行中のターンを停止する（SC-01 [停止]）
      description: |
        `pending` / `running` のターンを停止要求する。進行中のLLM呼び出し・ツール実行は中断し、ターンは `cancelled` で閉じる。
        停止要求は冪等（既に終端状態なら現在のターンをそのまま返す）。外部へ送信済みの副作用（Xへの投稿など）は取り消せない。
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        '202':
          description: 停止を受け付けた
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatTurn'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /chat/turns/{turnId}/retry:
    parameters:
      - $ref: '#/components/parameters/TurnId'
    post:
      tags: [chat]
      operationId: retryChatTurn
      summary: 失敗したターンを再試行する（SC-01 [再試行]）
      description: |
        `failed` のターンの入力（ユーザーメッセージ）を、**新しいターンとして**再実行する（元のターンは追記のみのため書き換えない）。
        `STEP_LIMIT` / `COST_LIMIT` で終了したターンを再試行しても、同じ上限が適用される。
        `blocked` のターンは再試行できない（`409 INVALID_STATE`）。
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        '202':
          description: 新しいターンを開始した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatTurn'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /chat/approvals:
    get:
      tags: [chat]
      operationId: listPendingApprovals
      summary: 承認待ちの承認カード一覧
      description: '`waiting_for_approval` のツール実行を新しい順に返す。会話をまたいだ「承認待ち」の確認に使う（会話を開き直すと `listChatTurns` でも復元される）。'
      parameters:
        - name: session_id
          in: query
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ToolExecution'
                  next_cursor:
                    type: [string, 'null']
        '401':
          $ref: '#/components/responses/Unauthorized'

  /chat/tool-executions/{toolExecutionId}/approve:
    parameters:
      - $ref: '#/components/parameters/ToolExecutionId'
    post:
      tags: [chat]
      operationId: approveToolExecution
      summary: 承認カードを承認する
      description: |
        承認カード（施策の確定／投稿内容の確定／Xへの投稿／データ削除）を承認する。**人間の承認境界であり、エージェントのツールからは呼べない**。
        画面が表示していた内容と実行内容が一致することを保証するため、カードの `approval.payload_hash` を必ず返す。
        承認後にサーバー側で内容が変わっていた場合は `409 APPROVAL_PAYLOAD_CHANGED`（カードを再取得して再確認する）。

        種別ごとの結果（`effect`）:
        - `campaign_commit`: 施策を `approved`（新規は `revision = approved_revision = 1`）で保存する
        - `post_content_commit`: 投稿を `approved` で保存し、`post_tracking_links` を生成する
        - `x_publish`: 投稿を `publishing` に遷移させ、非同期でXへ投稿する（`publishPost` と同じ処理・同じ事前条件。`Idempotency-Key` が必要）
        - `data_delete`: 対象を削除する（記憶は内容と埋め込みベクトルを完全に削除）

        承認後、ターンは続行してアシスタントが結果を報告する（ストリームで受け取る）。
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payload_hash]
              properties:
                payload_hash:
                  type: string
                  description: 承認カード（`ToolExecution.approval.payload_hash`）の値。
      responses:
        '200':
          description: 承認した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /chat/tool-executions/{toolExecutionId}/reject:
    parameters:
      - $ref: '#/components/parameters/ToolExecutionId'
    post:
      tags: [chat]
      operationId: rejectToolExecution
      summary: 承認カードを却下する／修正を依頼する
      description: |
        ツール実行を `cancelled` にし、エージェントには「ユーザーが却下した」というツール結果を返して、ターンを `cancelled` で閉じる。何も保存・実行されない。
        `instruction` を渡すと「修正を依頼」になり、その指示を入力とする**新しいターンをすぐに開始**する（`next_turn` に返る）。
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                instruction:
                  type: string
                  minLength: 1
                  maxLength: 4000
                  description: 修正指示。空でなければ新しいターンを開始する。
      responses:
        '200':
          description: 却下した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # ------------------------------------------------------------------ ops: cost
  /ops/cost/summary:
