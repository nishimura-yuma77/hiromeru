        平均・比率などの派生値は返さず、必要ならクライアントが算出する（`API_DESIGN.md` U-14）。
        未完了（`pending` / `processing` / `failed`）の投稿は値が `null`。公開前の投稿（`post_metrics` が未作成）は `metric = null` で返す。
      parameters:
