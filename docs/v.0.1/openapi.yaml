        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [memories]
      operationId: deleteMemory
      summary: 忘却する（記憶の物理削除）
      description: |
        SC-07「忘却」（確認ダイアログの後）。**内容と埋め込みベクトルを完全に削除**する。元に戻せない。紐づけ（`memory_campaigns` / `memory_posts`）は連鎖削除される。
        記憶の**編集APIは設けない**（内容を変えると埋め込みの再生成が必要で、記憶の再構成はスコープ外のため。修正は「忘却して覚えさせ直す」）。
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        '204':
          description: 削除した
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ------------------------------------------------------------------ chat
  /chat/sessions:
    get:
      tags: [chat]
      operationId: listChatSessions
      summary: 会話（親エージェントのセッション）一覧（SC-01 左ペイン）
      description: '`agent = parent` のセッションだけを、更新日時の降順で返す。既定ではアーカイブ済みを除く。'
      parameters:
        - name: include_archived
          in: query
