      operationId: getCostSummary
      summary: コストの集計（SC-08）
      description: |
        期間内のLLM呼び出しを集計する。合計コストは `llm_calls.cost_usd` の合計（`NULL` は除外し、`calls_without_cost_count` として件数を返す）。
        日別集計は `tz`（既定 `Asia/Tokyo`）の暦日で区切る。円換算は表示時のみ（`GET /config` の `jpy_per_usd`）。
        エージェント別は `llm_calls → agent_turns → agent_sessions.agent` で集計する。
        **モデル別の集計は返さない**（`llm_calls` にモデル名がない。U-5）。
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
