            application/json:
              schema:
                $ref: '#/components/schemas/ChatSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /chat/sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [chat]
      operationId: getChatSession
      summary: 会話のヘッダー情報
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [chat]
      operationId: updateChatSession
      summary: タイトル変更・アーカイブ／復元
      description: '`status: archived` でアーカイブ（`archived_at` を記録）、`active` で復元。実行中のターンがある会話はアーカイブできない（`409 TURN_IN_PROGRESS`）。'
      security:
