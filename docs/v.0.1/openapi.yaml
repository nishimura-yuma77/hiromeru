      description: |
        `pending_approval` → `approved`。`approved_revision = revision`、`approved_at` を記録する。
        `revision` が一致しなければ `409 REVISION_MISMATCH`。遷移先URLが未設定なら `422 LANDING_URL_REQUIRED`。
      security:
